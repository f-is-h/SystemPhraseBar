name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and ZIP
        run: zsh scripts/package.sh
      - name: Validate update parsing
        run: build/SystemPhraseBar.app/Contents/MacOS/SystemPhraseBar --self-test
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: SystemPhraseBar
          path: |
            build/*.app.zip
            build/SHA256SUMS.txt
